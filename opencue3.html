<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCue – 3D-Bühne (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;
  --panel:#101010;
  --panel-2:#181818;
  --line:#2a2a2a;
  --line-hi:#3d3d3d;
  --text:#ececec;
  --muted:#8c8c8c;
  --amber:#ffb000;
  --amber-dim:#5c4000;
  --ui:"Barlow","Segoe UI",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:fixed;inset:0}
#view{position:absolute;left:0;top:0;right:0;bottom:0;touch-action:none}
#view canvas{display:block}
.seg button,.cams button,#panelToggle,.key{white-space:nowrap}
#tags{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}

/* Panels */
.panel{background:rgba(0,0,0,.84);border:1px solid var(--line-hi);border-radius:6px;backdrop-filter:blur(8px)}
h3{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
h3 small{font-size:14px;color:var(--amber);font-weight:500;text-align:right}

/* Kopfzeile */
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:10px 14px;background:linear-gradient(#000 0%,rgba(0,0,0,.7) 60%,transparent 100%);z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--cond);font-size:23px;font-weight:700;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
.brand span{font-weight:500;color:var(--muted);font-size:19px}
.group{display:flex;align-items:center;gap:8px}
.lbl{font-family:var(--cond);font-size:15px;color:var(--muted)}
.sp{flex:1}
.seg{display:flex}
.seg button,.cams button,#panelToggle{font-family:var(--cond);font-size:16px;font-weight:600;background:var(--panel-2);border:1px solid var(--line-hi);padding:3px 13px;line-height:1.3}
.seg button{padding:3px 12px;margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
.cams{gap:6px}
.cams button,#panelToggle{border-radius:3px}
.seg button:hover,.cams button:hover,#panelToggle:hover{border-color:var(--text)}
.seg button[aria-pressed="true"],.cams button[aria-pressed="true"],#panelToggle[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#000}
#panelToggle{display:none}

/* Linkes Panel */
.left{position:absolute;left:14px;top:62px;width:290px;max-height:calc(100% - 62px - var(--bh,150px) - 28px);overflow:auto;padding:14px;z-index:4}
.left h3:not(:first-child){margin-top:16px}
#cards{display:grid;gap:6px}
.card{display:grid;grid-template-columns:24px 1fr 44px 12px;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 10px}
.card:hover{border-color:var(--line-hi)}
.card[aria-pressed="true"]{border-color:var(--amber);background:#120d00}
.card .num{font-family:var(--cond);font-weight:700;font-size:22px;color:var(--muted)}
.card[aria-pressed="true"] .num{color:var(--amber)}
.card .nm{font-family:var(--cond);font-weight:600;font-size:17px;line-height:1.15;white-space:nowrap}
.card .nm em{display:block;font-style:normal;font-weight:500;font-size:14px;color:var(--muted);white-space:pre}
.card .lv{height:5px;background:#222;border-radius:2px;overflow:hidden}
.card .lv i{display:block;height:100%;background:var(--amber);width:0}
.card .dot{width:12px;height:12px;border-radius:50%;border:1px solid #000;background:#444}
.row{display:grid;grid-template-columns:58px 1fr 52px;align-items:center;gap:8px;margin-bottom:6px}
.row span{font-family:var(--cond);font-size:16px;color:var(--muted)}
.row output{font-family:var(--cond);font-size:17px;text-align:right;color:var(--amber);font-weight:600}
input[type=range]{width:100%;accent-color:var(--amber);height:26px;cursor:pointer;background:transparent}
input[type=range]:disabled{opacity:.35;cursor:not-allowed}
#swatches{display:flex;gap:7px;flex-wrap:wrap}
#swatches button,#swatches .custom{width:30px;height:30px;border-radius:3px;border:1px solid var(--line-hi);background:var(--c)}
#swatches button[aria-pressed="true"]{outline:2px solid var(--amber);outline-offset:2px}
#swatches .custom{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);cursor:pointer}
#swatches .custom input{position:absolute;inset:-6px;width:44px;height:44px;opacity:0;cursor:pointer}

/* Fixture-Marken im 3D-Bild */
.tag{position:absolute;left:0;top:0;pointer-events:auto;min-width:26px;height:24px;padding:0 6px;border-radius:3px;background:#000;border:1px solid var(--line-hi);font-family:var(--cond);font-weight:700;font-size:16px;line-height:1}
.tag.sel{border-color:var(--amber);color:var(--amber)}

/* Untere Leiste */
.bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;padding:12px 14px;z-index:4}
.blk h3{margin-bottom:6px}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{position:relative;min-width:80px;height:46px;padding:4px 12px;background:var(--panel-2);border:1px solid var(--line-hi);border-radius:3px;font-family:var(--cond);font-weight:600;font-size:17px;line-height:1.1}
.key::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--amber);opacity:.3;border-radius:3px 3px 0 0}
.key:hover{border-color:var(--text)}
.key[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#000}
.key[aria-pressed="true"]::before{opacity:0}
.key.red::before{background:#ff3b30;opacity:.55}
.key.red[aria-pressed="true"]{background:#ff3b30;border-color:#ff3b30;color:#000}
.key:active{transform:translateY(1px)}
.faders{display:flex;gap:22px;flex-wrap:wrap}
.fader{width:150px}
.fader .row{grid-template-columns:1fr auto;margin:0}
.fader .row output{white-space:nowrap}
.fader input{grid-column:1/-1}

.hint{position:absolute;left:calc(50% + 150px);top:70px;transform:translateX(-50%);padding:7px 14px;font-family:var(--cond);font-size:16px;color:#bdbdbd;background:rgba(0,0,0,.75);border:1px solid var(--line);border-radius:20px;white-space:nowrap;transition:opacity .6s;z-index:3;pointer-events:none}
.hint.gone{opacity:0}

@media (max-width:1100px){
  .left{max-height:calc(100% - 62px - 210px)}
}
@media (max-width:860px){
  .top{gap:8px 10px;flex-wrap:wrap;background:#000}
  .lbl,.brand span{display:none}
  #panelToggle{display:block;order:2}
  .sp{order:1}
  .cams{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .cams button{white-space:nowrap}
  .left{display:none;width:min(320px,calc(100% - 28px));max-height:calc(100% - 62px - 14px);z-index:6;background:rgba(0,0,0,.94)}
  .left.open{display:block}
  .bottom{gap:14px;max-height:48%;overflow:auto;padding:10px}
  .key{min-width:68px;height:42px;padding:4px 8px}
  .fader{width:130px}
  .hint{display:none}
  .left{max-height:calc(100% - 62px - 14px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!--
  OpenCue – 3D-Bühne (Demo)
  Eigenständige Datei, three.js ist eingebettet. Steuerung von außen (z. B. per WebSocket):
    OpenCueStage3D.setFixtureCount(3)
    OpenCueStage3D.setFixture(0, { pan: -30, tilt: 40, dimmer: 0.8, zoom: 18, color: '#ff00aa' })
    OpenCueStage3D.setProgram('circle')   // manual | fan | wave | focus | circle | audience
    OpenCueStage3D.setMaster(0.7)
    OpenCueStage3D.camera('top')          // front | top | side | rig
-->
<div id="app">
  <div id="view"><div id="tags"></div></div>

  <header class="top">
    <div class="brand"><i></i>OpenCue <span>3D-Bühne</span></div>
    <div class="group">
      <span class="lbl">Scheinwerfer</span>
      <div class="seg" id="countSeg">
        <button type="button" data-n="2" aria-pressed="false">2</button>
        <button type="button" data-n="3" aria-pressed="false">3</button>
        <button type="button" data-n="4" aria-pressed="true">4</button>
      </div>
    </div>
    <div class="sp"></div>
    <div class="group cams" id="cams">
      <button type="button" data-cam="front">Publikum</button>
      <button type="button" data-cam="top">Oben</button>
      <button type="button" data-cam="side">Seite</button>
      <button type="button" data-cam="rig">Rig</button>
      <button type="button" id="orbit" aria-pressed="false">Auto-Orbit</button>
    </div>
    <button type="button" id="panelToggle" aria-pressed="false">Programmer</button>
  </header>

  <aside class="left panel" id="left">
    <h3><span>Fixtures</span><small id="selInfo"></small></h3>
    <div id="cards"></div>

    <h3><span>Programmer</span><small id="progHint"></small></h3>
    <label class="row"><span>Pan</span><input id="sPan" type="range" min="-270" max="270" step="1" value="0"><output id="oPan">0°</output></label>
    <label class="row"><span>Tilt</span><input id="sTilt" type="range" min="-120" max="120" step="1" value="30"><output id="oTilt">30°</output></label>
    <label class="row"><span>Zoom</span><input id="sZoom" type="range" min="6" max="50" step="1" value="22"><output id="oZoom">22°</output></label>
    <label class="row"><span>Dimmer</span><input id="sDim" type="range" min="0" max="100" step="1" value="100"><output id="oDim">100 %</output></label>

    <h3><span>Farbe</span></h3>
    <div id="swatches"></div>
  </aside>

  <footer class="bottom panel">
    <div class="blk">
      <h3><span>Programm</span></h3>
      <div class="keys" id="progKeys"></div>
    </div>
    <div class="blk">
      <h3><span>Effekte</span></h3>
      <div class="keys">
        <button type="button" class="key" id="fxBlind" aria-pressed="false" title="Gedrückt halten">Blinder</button>
        <button type="button" class="key" id="fxStrobe" aria-pressed="false">Strobe</button>
        <button type="button" class="key" id="fxCycle" aria-pressed="false">Farbwechsel</button>
        <button type="button" class="key red" id="fxBlack" aria-pressed="false" title="Taste B">Blackout</button>
      </div>
    </div>
    <div class="blk faders">
      <div class="fader"><div class="row"><span>Master</span><output id="oMaster">100 %</output><input id="sMaster" type="range" min="0" max="100" value="100"></div></div>
      <div class="fader"><div class="row"><span>Tempo</span><output id="oTempo">1×</output><input id="sTempo" type="range" min="0.2" max="3" step="0.05" value="1"></div></div>
      <div class="fader"><div class="row"><span>Nebel</span><output id="oHaze">55 %</output><input id="sHaze" type="range" min="0" max="100" value="55"></div></div>
    </div>
  </footer>

  <div class="hint" id="hint">Ziehen: drehen · Rechtsklick oder zwei Finger: verschieben · Scrollen: zoomen · Scheinwerfer anklicken: auswählen</div>
</div>
